version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-employedb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: employedb
      MYSQL_USER: admin
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  employe-app:
    build: .
    container_name: employe-service
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/employedb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password123
      SPRING_PROFILES_ACTIVE: prod

volumes:
  mysql-data:
